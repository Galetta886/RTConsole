name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Run isolated tests
        shell: powershell
        run: .\test\run-all.ps1
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTConsole-windows
          path: artifacts/app/
          if-no-files-found: error
